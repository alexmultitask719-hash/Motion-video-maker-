<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Video Maker</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0f0f0f;color:white;text-align:center;padding:15px}
  h1{font-size:28px;margin:10px 0}
  h1 span{color:#ffcc00}
  p{color:#aaa;font-size:14px;margin-bottom:15px}
  #stage{background:white;border-radius:12px;max-width:720px;width:100%;margin:0 auto;overflow:hidden}
  canvas{width:100%;display:block;background:white}
  .controls{background:#1a1a1a;max-width:720px;margin:15px auto;padding:15px;border-radius:12px;text-align:left}
  label{display:block;margin:10px 0 5px;font-size:13px;color:#ccc}
  select,textarea,input{width:100%;padding:10px;border-radius:8px;border:none;outline:none;background:#2a2a2a;color:white}
  textarea{height:60px;resize:none}
  .row{display:flex;gap:10px;margin-top:15px}
  button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
  .play{background:#ffcc00;color:black}
  .stop{background:#333;color:white}
  .rec{background:#ff3b30;color:white}
  .dl{background:#00c853;color:white}
  #status{margin-top:10px;font-size:13px;color:#ffcc00;text-align:center}
  .badge{display:inline-block;background:#222;padding:5px 10px;border-radius:20px;font-size:12px;margin:3px}
</style>
</head>
<body>

<h1>MOTION <span>VIDEO MAKER</span></h1>
<p>Make Ricky Clips Style Stickman Videos - Free, No Login</p>

<div id="stage">
  <canvas id="canvas" width="720" height="480"></canvas>
</div>

<div class="controls">
  <span class="badge">Character: Ricky Style</span>
  <span class="badge">Round Head + Oval Body</span>
  <span class="badge">60 Sec Ready</span>

  <label>1. Choose Action</label>
  <select id="action">
    <option value="fight">Fight - Punch + Kick</option>
    <option value="walk">Walk</option>
    <option value="dance">Dance Funny</option>
    <option value="jump">Jump + Punch</option>
    <option value="story">Story Mode - Act Your Prompt</option>
  </select>

  <label>2. Background</label>
  <select id="bg">
    <option value="white">White - Like Ricky Clips</option>
    <option value="black">Black</option>
    <option value="city">City</option>
    <option value="sky">Sky / Day</option>
  </select>

  <label>3. Your Story / Prompt (For Story Mode)</label>
  <textarea id="prompt" placeholder="Example: A man who did not sleep for 11 days...">A man who did not sleep for 11 days. He starts seeing things...</textarea>

  <label>4. Caption Text On Video</label>
  <input id="caption" value="He did not sleep for 11 days..." />

  <div class="row">
    <button class="play" onclick="playAnim()">▶ PLAY</button>
    <button class="stop" onclick="stopAnim()">⏸ STOP</button>
  </div>
  <div class="row">
    <button class="rec" onclick="startRecord()">● START RECORD</button>
    <button class="dl" onclick="stopRecord()">⬇ STOP & DOWNLOAD</button>
  </div>
  <div id="status">Ready. Press PLAY to preview.</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let t = 0, playing = false, animId = null;
let recorder = null, chunks = [];

// Ricky Clips Style Stickman - Round head, round eyes with dot, oval body
function drawStickman(x, y, pose, flip=false){
  ctx.save();
  ctx.translate(x, y);
  if(flip) ctx.scale(-1,1);
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#111';
  ctx.fillStyle = '#fff';
  ctx.lineCap = 'round';

  // Legs
  let legSwing = Math.sin(t*0.2) * 20;
  if(pose==='walk'){ legSwing = Math.sin(t*0.3)*25; }
  if(pose==='fight'){ legSwing = Math.sin(t*0.5)*10; }
  if(pose==='jump'){ legSwing = 15; }
  if(pose==='dance'){ legSwing = Math.sin(t*0.6)*30; }

  ctx.beginPath(); ctx.moveTo(0, 90); ctx.lineTo(-20+legSwing, 160); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 90); ctx.lineTo(20-legSwing, 160); ctx.stroke();

  // Oval Body - Ricky style
  ctx.beginPath();
  ctx.ellipse(0, 55, 22, 38, 0, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();

  // Arms
  let arm = 0;
  if(pose==='fight') arm = Math.sin(t*0.6)*30;
  if(pose==='dance') arm = Math.sin(t*0.8)*40;
  if(pose==='jump') arm = -30;

  // Left arm
  ctx.beginPath(); ctx.moveTo(-10, 35); ctx.lineTo(-45+arm, 70); ctx.stroke();
  // Right arm - punching
  let punch = 0;
  if(pose==='fight') punch = Math.max(0, Math.sin(t*0.6))*35;
  if(pose==='story') punch = Math.max(0, Math.sin(t*0.3))*20;
  ctx.beginPath(); ctx.moveTo(10, 35); ctx.lineTo(45+punch, 70); ctx.stroke();

  // Round Head - NOT perfect circle, slightly oval like Ricky
  ctx.beginPath();
  ctx.ellipse(0, -20, 38, 35, 0, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();

  // Round Eyes with black dot inside
  // Left eye
  ctx.beginPath(); ctx.arc(-12, -25, 9, 0, Math.PI*2); ctx.fillStyle='white'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-12, -25, 3.5, 0, Math.PI*2); ctx.fillStyle='black'; ctx.fill();
  // Right eye
  ctx.beginPath(); ctx.arc(12, -25, 9, 0, Math.PI*2); ctx.fillStyle='white'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(12, -25, 3.5, 0, Math.PI*2); ctx.fillStyle='black'; ctx.fill();

  // Mouth - small line, changes in story
  ctx.beginPath();
  if(pose==='dance') ctx.arc(0, -5, 8, 0, Math.PI);
  else ctx.moveTo(-8, -5), ctx.lineTo(8, -5);
  ctx.stroke();

  ctx.restore();
}

function drawBg(){
  let bg = document.getElementById('bg').value;
  if(bg==='white') ctx.fillStyle='white';
  if(bg==='black') ctx.fillStyle='#111';
  if(bg==='city'){ ctx.fillStyle='#87CEEB'; ctx.fillRect(0,0,720,480); ctx.fillStyle='#555'; ctx.fillRect(50,150,80,250); ctx.fillRect(160,120,100,280); ctx.fillRect(500,150,90,250); ctx.fillRect(0,400,720,80); return; }
  if(bg==='sky'){ ctx.fillStyle='#aee2ff'; ctx.fillRect(0,0,720,480); ctx.fillStyle='yellow'; ctx.beginPath(); ctx.arc(600,70,30,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#7ec850'; ctx.fillRect(0,400,720,80); return; }
  ctx.fillRect(0,0,720,480);
  // Ground line
  ctx.strokeStyle='#ddd'; ctx.beginPath(); ctx.moveTo(0,400); ctx.lineTo(720,400); ctx.stroke();
}

function draw(){
  drawBg();
  let action = document.getElementById('action').value;
  let caption = document.getElementById('caption').value;

  // Stickman 1 - Main
  let x1 = 220 + Math.sin(t*0.05)*10;
  let y1 = 240;
  if(action==='jump') y1 = 240 - Math.abs(Math.sin(t*0.2))*60;
  if(action==='walk') x1 = 150 + (t % 400);
  drawStickman(x1, y1, action);

  // Stickman 2 - Enemy for fight
  if(action==='fight'){
    let x2 = 480;
    drawStickman(x2, 240, 'fight', true);
    // Hit effect
    if(Math.sin(t*0.6) > 0.8){
      ctx.fillStyle='yellow'; ctx.font='bold 30px Arial'; ctx.fillText('POW!', 350, 180);
    }
  }

  // Caption
  ctx.fillStyle = 'black';
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'center';
  // White box behind text
  if(caption){
    let w = ctx.measureText(caption).width + 20;
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fillRect(360-w/2, 20, w, 40);
    ctx.fillStyle='black'; ctx.fillText(caption, 360, 48);
  }

  // Scene timer for 60 sec idea
  ctx.fillStyle='#888'; ctx.font='12px Arial'; ctx.textAlign='left';
  ctx.fillText('Motion Video Maker - Scene: ' + (Math.floor(t/300)+1) + ' / 6  |  ' + Math.floor(t/60) + ' sec', 10, 470);

  t++;
  if(playing) animId = requestAnimationFrame(draw);
}

function playAnim(){
  playing = true; t=0;
  document.getElementById('status').innerText = 'Playing... Press START RECORD to record 60 sec video.';
  draw();
}
function stopAnim(){ playing=false; cancelAnimationFrame(animId); }

function startRecord(){
  if(!playing) playAnim();
  chunks = [];
  let stream = canvas.captureStream(30);
  recorder = new MediaRecorder(stream, {mimeType:'video/webm'});
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    let blob = new Blob(chunks, {type:'video/webm'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href=url; a.download='motion-video-maker.webm'; a.click();
    document.getElementById('status').innerText = 'Downloaded! Post it on YouTube.';
  };
  recorder.start();
  document.getElementById('status').innerText = '● RECORDING... Act your video now. Press STOP & DOWNLOAD when done.';
}
function stopRecord(){ if(recorder) recorder.stop(); stopAnim(); }

// Initial draw
drawBg(); drawStickman(220,240,'fight'); t=0;
</script>
</body>
</html>
