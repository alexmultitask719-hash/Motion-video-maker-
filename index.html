<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Video Maker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f1220; color: #f2f2f2; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #9aa0b8; }
  .panel { background: #181c30; border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  label { display: block; margin: 12px 0 6px; font-size: 14px; color: #c5c9de; }
  input[type=file], select, input[type=number] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2c3254;
    background: #0f1220; color: #f2f2f2; font-size: 15px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
  button {
    margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 10px;
    background: #5b6cff; color: white; font-size: 16px; cursor: pointer;
  }
  button:disabled { background: #3a4070; cursor: not-allowed; }
  canvas, video { width: 100%; border-radius: 10px; background: #000; display: block; }
  #status { margin-top: 10px; color: #9aa0b8; font-size: 14px; }
  a.download { display: inline-block; margin-top: 12px; color: #8fd1ff; font-size: 16px; }
  .bar { height: 8px; background: #2c3254; border-radius: 6px; overflow: hidden; margin-top: 10px; }
  .bar div { height: 100%; width: 0; background: #5b6cff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Motion Video Maker</h1>
  <p class="sub">Turn a still image into a video with small, smooth movements.</p>

  <div class="panel">
    <label for="file">1. Choose an image</label>
    <input id="file" type="file" accept="image/*">

    <div class="row">
      <div>
        <label for="motion">2. Motion</label>
        <select id="motion">
          <option value="zoomin">Slow zoom in</option>
          <option value="zoomout">Slow zoom out</option>
          <option value="panleft">Pan left</option>
          <option value="panright">Pan right</option>
          <option value="panup">Pan up</option>
          <option value="pandown">Pan down</option>
          <option value="drift">Gentle drift (floating)</option>
          <option value="random">Random per video</option>
        </select>
      </div>
      <div>
        <label for="duration">3. Seconds (max 60)</label>
        <input id="duration" type="number" min="2" max="60" value="8">
      </div>
      <div>
        <label for="ratio">4. Shape</label>
        <select id="ratio">
          <option value="1920x1080">16:9 (YouTube)</option>
          <option value="1080x1920">9:16 (Shorts / TikTok)</option>
          <option value="1080x1080">1:1 (Square)</option>
        </select>
      </div>
    </div>

    <label for="strength">Motion strength</label>
    <select id="strength">
      <option value="0.06">Subtle</option>
      <option value="0.10" selected>Medium</option>
      <option value="0.16">Strong</option>
    </select>

    <button id="go" disabled>Generate video</button>
    <div class="bar"><div id="progress"></div></div>
    <div id="status">Pick an image to begin.</div>
  </div>

  <div class="panel">
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <div id="result"></div>
  </div>
</div>

<script>
const fileInput = document.getElementById('file');
const goBtn = document.getElementById('go');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progress');
const resultEl = document.getElementById('result');

let img = null;

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const image = new Image();
  image.onload = () => {
    img = image;
    goBtn.disabled = false;
    statusEl.textContent = 'Image loaded. Choose your settings and press Generate.';
    setCanvasSize();
    drawFrame(0, 'zoomin', 0.10);
  };
  image.src = url;
});

document.getElementById('ratio').addEventListener('change', () => {
  setCanvasSize();
  if (img) drawFrame(0, 'zoomin', 0.10);
});

function setCanvasSize() {
  const [w, h] = document.getElementById('ratio').value.split('x').map(Number);
  canvas.width = w;
  canvas.height = h;
}

function ease(t) { return t * t * (3 - 2 * t); }

// Draws one frame. t goes from 0 to 1 across the whole video.
function drawFrame(t, motion, strength) {
  const cw = canvas.width, ch = canvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);

  const baseScale = Math.max(cw / img.width, ch / img.height);
  let scale = baseScale * (1 + strength);
  let offsetX = 0, offsetY = 0;
  const e = ease(t);

  switch (motion) {
    case 'zoomin':  scale = baseScale * (1 + strength * e); break;
    case 'zoomout': scale = baseScale * (1 + strength * (1 - e)); break;
    case 'panleft':  offsetX = 0.5 - e; break;
    case 'panright': offsetX = -0.5 + e; break;
    case 'panup':    offsetY = 0.5 - e; break;
    case 'pandown':  offsetY = -0.5 + e; break;
    case 'drift':
      offsetX = Math.sin(t * Math.PI * 2) * 0.5;
      offsetY = Math.cos(t * Math.PI * 2 * 0.8) * 0.5;
      break;
  }

  const drawW = img.width * scale;
  const drawH = img.height * scale;
  const spareX = Math.max(0, drawW - cw);
  const spareY = Math.max(0, drawH - ch);
  const x = (cw - drawW) / 2 + offsetX * spareX;
  const y = (ch - drawH) / 2 + offsetY * spareY;
  ctx.drawImage(img, x, y, drawW, drawH);
}

goBtn.addEventListener('click', async () => {
  if (!img) return;
  goBtn.disabled = true;
  resultEl.innerHTML = '';
  progressEl.style.width = '0%';

  let motion = document.getElementById('motion').value;
  if (motion === 'random') {
    const options = ['zoomin','zoomout','panleft','panright','panup','pandown','drift'];
    motion = options[Math.floor(Math.random() * options.length)];
  }
  const seconds = Math.min(60, Math.max(2, Number(document.getElementById('duration').value) || 8));
  const strength = Number(document.getElementById('strength').value);
  const fps = 30;

  const mimeTypes = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m));
  if (!mime) {
    statusEl.textContent = 'Your browser cannot record video. Please try Chrome or Edge.';
    goBtn.disabled = false;
    return;
  }

  const stream = canvas.captureStream(fps);
  const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

  const finished = new Promise(resolve => { recorder.onstop = resolve; });
  recorder.start();
  statusEl.textContent = 'Rendering (' + motion + ')... keep this tab open.';

  const startTime = performance.now();
  await new Promise(resolve => {
    function tick(now) {
      const t = Math.min(1, (now - startTime) / (seconds * 1000));
      drawFrame(t, motion, strength);
      progressEl.style.width = (t * 100).toFixed(0) + '%';
      if (t < 1) requestAnimationFrame(tick); else resolve();
    }
    requestAnimationFrame(tick);
  });

  recorder.stop();
  await finished;

  const blob = new Blob(chunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  resultEl.innerHTML =
    '<video controls src="' + url + '"></video>' +
    '<a class="download" download="motion-video.webm" href="' + url + '">Download video</a>';
  statusEl.textContent = 'Done! Your video is ready.';
  goBtn.disabled = false;
});
</script>
</body>
</html>
